#user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 35535;
pcre_jit on;

error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
    accept_mutex off;
}

stream {
    map_hash_bucket_size 128;
    map_hash_max_size 4096;

    map $ssl_preread_server_name $backend_name {
        adg.snorbo.vip dns_backend;
        default xray_reality_backend;
    }

    upstream none_backend         { server 127.0.0.1:8443; }
    upstream xray_reality_backend { server 127.0.0.1:1554; }
    upstream dns_backend          { server 127.0.0.1:2999; }
    upstream web_backend          {
        server 127.0.0.1:8443 max_fails=3 fail_timeout=10s;
        zone backend 64k;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend_name;
        proxy_protocol on;
    }

    server {
        listen 443 udp reuseport;
        listen [::]:443 udp reuseport;
        proxy_pass none_backend;
    }
}

http {
    server_tokens off;
    include mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;
    msie_padding off;

    # ---------- 新增：TLS 会话复用与 0-RTT（全局生效） ----------
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_early_data      on;

    map $http_x_forwarded_for $clientRealIp {
        "" $remote_addr;
        "~*(?P<firstAddr>([0-9a-f]{0,4}:){1,7}[0-9a-f]{1,4}|([0-9]{1,3}\.){3}[0-9]{1,3})$" $firstAddr;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format main '$clientRealIp $remote_addr $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $http_x_forwarded_for '
                    '"$upstream_addr" "$upstream_status" "$upstream_response_time" "$request_time" ';
    access_log logs/access.log main buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 60;
    keepalive_requests 10000;
    gzip on;
    gzip_min_length 2k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_comp_level 5;

    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    # AdGuard 面板
    server {
        listen 127.0.0.1:2999 ssl proxy_protocol;
        server_name adg.snorbo.vip;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_session_tickets on;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        ssl_certificate /etc/letsencrypt/live/snorbo.vip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snorbo.vip/privkey.pem;
        ssl_protocols TLSv1.3;
        http2 on;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /zhouu {
            rewrite ^/zhouu$ /dns-query break;
            proxy_pass https://127.0.0.1:3000/dns-query;
            proxy_set_header Host $host;
        }

        location /dns-query { return 404; }
    }

    # 默认 SSL 服务器（拒绝未知域名）
    server {
        listen 127.0.0.1:8443 quic default_server;
        listen 127.0.0.1:8443 ssl proxy_protocol default_server;
        server_name _;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_certificate /etc/letsencrypt/live/snorbo.vip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snorbo.vip/privkey.pem;
        ssl_protocols TLSv1.3;
        http2 on;

        return 444;
    }

    # Web & Cloudreve
    server {
        listen 127.0.0.1:8443 quic reuseport;
        listen 127.0.0.1:8443 ssl proxy_protocol reuseport;
        http2 on;

        server_name op.snorbo.vip;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_session_tickets on;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        ssl_certificate /etc/letsencrypt/live/snorbo.vip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snorbo.vip/privkey.pem;
        ssl_protocols TLSv1.3;

        location /news {
            grpc_pass grpc://127.0.0.1:1551;
        }

        location / {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Alt-Svc 'h3=":443"; ma=86400';

            proxy_pass http://127.0.0.1:1552;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket / 长连接支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }
    }

    # API 代理
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        server_name api.snorbo.vip;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_certificate /etc/letsencrypt/live/snorbo.vip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snorbo.vip/privkey.pem;
        ssl_protocols TLSv1.3;
        http2 on;

        location / {
            proxy_pass http://127.0.0.1:2211;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket / 长连接支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }
    }

    # Dash 静态站点
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        server_name dash.snorbo.vip;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_certificate /etc/letsencrypt/live/snorbo.vip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snorbo.vip/privkey.pem;
        ssl_protocols TLSv1.3;
        http2 on;

        root /var/www/nodeget-board/dist;
        index index.html;

        # 带哈希的静态资源长缓存
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 前端路由 fallback，HTML 不缓存
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # Status 静态站点
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        server_name status.snorbo.vip;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        ssl_certificate /etc/letsencrypt/live/snorbo.vip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snorbo.vip/privkey.pem;
        ssl_protocols TLSv1.3;
        http2 on;

        root /var/www/nodeget-statusshow/dist;
        index index.html;

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
